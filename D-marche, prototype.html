<!doctype html>
<html lang="fr" data-text="normal" data-contrast="normal" data-motion="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pas à pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* ---------- 1. GLOBAL : primitives, jamais utilisées directement ---------- */
  /* Palette */
  --g-white:#FFFFFF; --g-black:#000000;
  --g-green-900:#0C1A13; --g-green-800:#003B22; --g-green-700:#2B6A4E; --g-green-300:#86CDA8; --g-green-200:#C7DDD0; --g-green-100:#DCEAE2;
  --g-green-ink-900:#16241F; --g-green-ink-700:#3B4D46; --g-green-ink-100:#EEF3F0; --g-green-ink-200:#C4D1CA;
  --g-sage-700:#36483F; --g-sage-600:#34463D; --g-sage-500:#22392D; --g-sage-400:#1E3529; --g-sage-300:#C3CFC8; --g-sage-200:#C9D3CC; --g-sage-100:#DFE7E2;
  --g-ink-dark-900:#0B1310; --g-ink-dark-800:#111C17; --g-ink-dark-700:#192620; --g-green-frame:#1F2E28;
  --g-amber-700:#A8701A; --g-amber-500:#E3A63B; --g-amber-400:#F0BE5E; --g-amber-100:#FFF3DC; --g-amber-900:#2D2412;
  --g-red-700:#9B1C1C; --g-red-300:#FFB3B3; --g-red-100:#FBE3E3; --g-red-900:#3A1717;
  --g-blue-600:#1B4FD8; --g-blue-300:#9DB8FF;
  --g-grey-500:#6E6E6E; --g-yellow-400:#FFD400;
  /* Échelles */
  --g-size-1:.2rem; --g-size-2:.3rem; --g-size-3:.4rem; --g-size-4:.5rem; --g-size-5:.6rem; --g-size-6:.75rem; --g-size-7:.9rem; --g-size-8:1.1rem; --g-size-9:1.25rem;
  --g-radius-1:8px; --g-radius-2:14px; --g-radius-3:18px; --g-radius-4:22px; --g-radius-full:999px;
  --g-border-1:2px; --g-border-2:3px;

  /* ---------- 2. SEMANTIC : rôles, seule couche qui change selon le mode ---------- */
  --canvas:var(--g-sage-100); --device-frame:var(--g-green-frame);
  --bg:#F2F5F1; --surface:var(--g-white); --ink:var(--g-green-ink-900); --ink-soft:var(--g-green-ink-700); --line:var(--g-sage-300);
  --primary:var(--g-green-700); --primary-ink:var(--g-white); --primary-soft:var(--g-green-100); --illus-fill:var(--g-green-200);
  --illus-accent:var(--g-amber-500); --illus-line:var(--g-sage-200); --warn-bg:var(--g-amber-100); --warn-line:var(--g-amber-700);
  --focus:var(--g-blue-600); --border-width:var(--g-border-1);
  --danger:var(--g-red-700); --danger-bg:var(--g-red-100);
  --radius-sm:var(--g-radius-1); --radius-md:var(--g-radius-2); --radius-lg:var(--g-radius-3); --radius-xl:var(--g-radius-4); --radius-pill:var(--g-radius-full);
  --space-2xs:var(--g-size-1); --space-xs:var(--g-size-2); --space-sm:var(--g-size-3); --space-md:var(--g-size-4); --space-lg:var(--g-size-5); --space-xl:var(--g-size-6); --space-2xl:var(--g-size-7); --space-3xl:var(--g-size-8); --space-gutter:var(--g-size-9);

  /* ---------- 3. COMPOSANT : décisions par composant ---------- */
  --btn-radius:var(--radius-md); --btn-min-h:3.2rem;
  --card-bg:var(--surface); --card-radius:var(--radius-xl); --card-pad:var(--space-3xl);
  --field-radius:var(--radius-md); --field-min-h:3rem;
  /* Tag : badge, chip difficulté, tag filtre, badge trophée */
  --tag-radius:var(--radius-pill); --tag-bg:transparent; --tag-ink:var(--ink-soft); --tag-border:var(--line); --tag-pad:var(--space-2xs) var(--space-lg); --tag-size:.8rem;
  /* Button : plein, contour, lien, danger, icône */
  --btn-bg:var(--primary); --btn-ink:var(--primary-ink); --btn-border:transparent; --btn-pad:var(--space-xl) var(--space-gutter);
  --iconbtn-size:3rem; --iconbtn-radius:var(--radius-md);
  /* Card : rail, carrée, balade, point de passage, participant */
  --card-width:auto; --card-border:var(--line);
  /* Segmented : périodes, ancres, chips filtre */
  --seg-radius:var(--radius-lg); --seg-opt-radius:var(--radius-md); --seg-gap:var(--space-xs);
  /* Metric : stat, kpi, barre */
  --metric-pad:var(--space-xl) var(--space-xs); --metric-gap:var(--space-sm); --track-h:.9rem; --track-bg:var(--illus-line);
  --chip-facile-bg:var(--primary-soft); --chip-facile-ink:var(--primary);
  --chip-moderee-bg:var(--warn-bg); --chip-moderee-ink:var(--warn-line);
  --chip-soutenue-bg:var(--danger-bg); --chip-soutenue-ink:var(--danger);
  --tabbar-bg:var(--surface); --sheet-radius:var(--radius-xl);
  --trophy-radius:var(--radius-lg); --square-radius:var(--radius-lg);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;font-size:112.5%}
html[data-text="large"]{font-size:131.25%}
html[data-text="xlarge"]{font-size:150%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:var(--g-ink-dark-900); --device-frame:var(--g-black);
    --bg:var(--g-ink-dark-800); --surface:var(--g-ink-dark-700); --ink:var(--g-green-ink-100); --ink-soft:var(--g-green-ink-200); --line:var(--g-sage-700);
    --primary:var(--g-green-300); --primary-ink:var(--g-green-900); --primary-soft:var(--g-sage-400); --illus-fill:var(--g-sage-500);
    --illus-accent:var(--g-amber-400); --illus-line:var(--g-sage-600); --warn-bg:var(--g-amber-900); --warn-line:var(--g-amber-500); --focus:var(--g-blue-300); --danger:var(--g-red-300); --danger-bg:var(--g-red-900);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --canvas:var(--g-ink-dark-900); --device-frame:var(--g-black);
  --bg:var(--g-ink-dark-800); --surface:var(--g-ink-dark-700); --ink:var(--g-green-ink-100); --ink-soft:var(--g-green-ink-200); --line:var(--g-sage-700);
  --primary:var(--g-green-300); --primary-ink:var(--g-green-900); --primary-soft:var(--g-sage-400); --illus-fill:var(--g-sage-500);
  --illus-accent:var(--g-amber-400); --illus-line:var(--g-sage-600); --warn-bg:var(--g-amber-900); --warn-line:var(--g-amber-500); --focus:var(--g-blue-300); --danger:var(--g-red-300); --danger-bg:var(--g-red-900);
}
/* Contraste élevé : prioritaire sur le thème */
:root[data-contrast="high"]{
  --canvas:var(--g-white); --device-frame:var(--g-black);
  --bg:var(--g-white); --surface:var(--g-white); --ink:var(--g-black); --ink-soft:var(--g-black); --line:var(--g-black);
  --primary:var(--g-green-800); --primary-ink:var(--g-white); --primary-soft:var(--g-white); --illus-fill:var(--g-white);
  --illus-accent:var(--g-black); --illus-line:var(--g-grey-500); --warn-bg:var(--g-white); --warn-line:var(--g-black); --focus:var(--g-black); --border-width:var(--g-border-2); --danger:var(--g-black); --danger-bg:var(--g-white);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;line-height:1.5;
  -webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1{font-size:1.75rem;line-height:1.2;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;line-height:1.3}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:var(--radius-sm)}
[data-contrast="high"] :focus-visible{outline:4px solid #000;box-shadow:0 0 0 8px #FFD400}
h1:focus{outline:none}

/* Shell */
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.phone{position:relative;background:var(--bg);display:flex;flex-direction:column;min-height:100dvh}
.scroller{display:flex;flex-direction:column;flex:1}
@media (min-width:900px){
  .shell{grid-template-columns:260px 420px;justify-content:center;align-items:center;gap:56px;padding:32px}
  .phone{height:min(880px,calc(100dvh - 64px));min-height:0;border:10px solid var(--device-frame);border-radius:44px;overflow:hidden}
  .scroller{overflow-y:auto;overscroll-behavior:contain}
}

/* Panneau prototype */
.proto{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--space-lg) var(--space-2xl);font-size:.85rem}
.proto summary{cursor:pointer;font-weight:700;min-height:2.75rem;display:flex;align-items:center}
.proto ol{list-style:none;padding:0;margin:var(--space-md) 0 0;display:grid;gap:var(--space-sm);counter-reset:s}
.proto li button{counter-increment:s;width:100%;text-align:left;font:inherit;padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-md);border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:2.75rem}
.proto li button::before{content:counter(s) ". ";color:var(--ink-soft)}
.proto li button[aria-current="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.proto li button[aria-current="true"]::before{color:inherit}
.proto .proto-note{margin-top:var(--space-xl);color:var(--ink-soft)}
@media (min-width:900px){
  .proto{border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-gutter);align-self:center}
  .proto summary{font-size:1rem}
}

/* Écran */
.screen{flex:1 0 auto;display:flex;flex-direction:column;gap:var(--space-3xl);padding:var(--space-gutter) var(--space-gutter) 1.5rem}
.lead{font-size:1.15rem;color:var(--ink)}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem;color:var(--ink-soft)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-xl);padding-top:var(--space-md)}
.card{background:var(--card-bg);border:var(--border-width) solid var(--line);border-radius:var(--card-radius);padding:var(--card-pad)}
[data-contrast="high"] .card{border-width:3px}

/* Boutons */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:var(--space-md);width:100%;
  min-height:3.4rem;padding:var(--btn-pad);border-radius:var(--radius-lg);border:var(--border-width) solid var(--btn-border);background:var(--btn-bg);color:var(--btn-ink);
  font:inherit;font-size:1.1rem;font-weight:700;line-height:1.2;cursor:pointer;text-align:center}
.btn.primary{min-height:3.8rem}
.btn.secondary{--btn-bg:var(--surface);--btn-ink:var(--ink);--btn-border:var(--ink-soft)}
.btn.quiet{--btn-bg:transparent;--btn-ink:var(--primary);text-decoration:underline;text-underline-offset:4px;min-height:3rem}
[data-contrast="high"] .btn.primary{border-color:#000}
.btn:active{transform:translateY(1px)}

/* En-tête intérieur */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);min-height:3rem;position:sticky;top:0;z-index:6;background:var(--bg);padding-top:var(--space-sm);padding-bottom:var(--space-sm)}
.back{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:3rem;padding:var(--space-sm) var(--space-xl) var(--space-sm) var(--space-xs);margin-left:calc(-1 * var(--space-xs));
  background:none;border:var(--border-width) solid transparent;border-radius:var(--radius-md);color:var(--primary);font:inherit;font-weight:700;cursor:pointer}
.back svg{width:1.4rem;height:1.4rem}
.steps{font-size:.95rem;color:var(--ink-soft);font-weight:700}
.dots{display:flex;gap:var(--space-sm)}
.dots span{width:2rem;height:.4rem;border-radius:var(--radius-sm);background:var(--line)}
.dots span.on{background:var(--primary)}

/* Choix */
fieldset{border:0;margin:0;padding:0;min-width:0}
.choices{display:grid;gap:var(--space-xl)}
.choice{display:flex;gap:var(--space-2xl);align-items:flex-start;padding:var(--space-2xl);border:var(--border-width) solid var(--line);border-radius:var(--radius-lg);background:var(--surface);cursor:pointer;min-height:3.5rem}
.choice input{flex:none;width:1.6rem;height:1.6rem;margin:var(--space-2xs) 0 0;accent-color:var(--primary)}
.choice strong{display:block;font-size:1.08rem}
.choice .desc{display:block;color:var(--ink-soft);font-size:.95rem;margin-top:var(--space-2xs)}
.choice:has(input:checked){border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
[data-contrast="high"] .choice:has(input:checked){box-shadow:inset 0 0 0 3px #000}
.choice.row{align-items:center}
.checks .choice{padding:var(--space-xl) var(--space-2xl)}
.error{color:var(--danger);font-weight:700}

/* Segments (durée, taille de texte) */
.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-md)}
.seg{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2xs);min-height:4rem;padding:var(--space-md) var(--space-2xs);
  border:var(--border-width) solid var(--line);border-radius:var(--radius-lg);background:var(--surface);font-weight:700;text-align:center;line-height:1.2}
.seg small{font-weight:400;color:var(--ink-soft);font-size:.8rem}
.seg input:checked + span{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
[data-contrast="high"] .seg input:checked + span{box-shadow:inset 0 0 0 3px #000}
.seg input:focus-visible + span{outline:4px solid var(--focus);outline-offset:3px}

/* Note de sécurité */
.note{display:flex;gap:var(--space-xl);align-items:flex-start;background:var(--warn-bg);border:var(--border-width) solid var(--warn-line);border-left-width:8px;border-radius:var(--radius-md);padding:var(--space-2xl) var(--space-2xl)}
.note svg{flex:none;width:1.5rem;height:1.5rem;color:var(--warn-line);margin-top:var(--space-2xs)}
.note p{font-size:.98rem}

/* Sentier */
.trail{width:100%;height:auto;display:block}
.trail .h1{fill:var(--primary-soft)}
.trail .h2{fill:var(--illus-fill)}
.trail .sun{fill:var(--illus-accent);opacity:.85}
.trail-base,.trail-prog{fill:none;stroke-linecap:round;stroke-width:12}
.trail-base{stroke:var(--illus-line)}
.trail-prog{stroke:var(--primary);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .8s ease}
.trail-marker circle{fill:var(--illus-accent);stroke:var(--surface);stroke-width:4}
.trail-marker .dot{fill:var(--surface);stroke:none}
.trail-flag line{stroke:var(--ink-soft);stroke-width:3;stroke-linecap:round}
.trail-flag path{fill:var(--illus-accent)}
[data-contrast="high"] .trail .h1,[data-contrast="high"] .trail .h2{fill:#fff;stroke:#000;stroke-width:2}
[data-contrast="high"] .trail-marker circle{fill:#000;stroke:#fff}
[data-contrast="high"] .trail-marker .dot{fill:#fff}

/* Accueil */
.hello{display:flex;flex-direction:column;gap:var(--space-2xs)}
.date{color:var(--ink-soft);font-size:1rem}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-md);flex-wrap:wrap}
.goal-value{font-size:2.4rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.goal-value small{font-size:1.1rem;font-weight:700;color:var(--ink-soft);letter-spacing:0}
.goal-label{font-weight:700;color:var(--ink-soft)}
.reco{border-left:6px solid var(--illus-accent);padding:var(--space-2xs) 0 var(--space-2xs) var(--space-2xl)}
[data-contrast="high"] .reco{border-left-color:#000}

/* Marche */
.walk-status{text-align:center;font-weight:700;font-size:1.1rem;color:var(--primary);min-height:1.6rem}
.walk-status.paused{color:var(--warn-line)}
.timer{text-align:center;font-size:4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer-sub{text-align:center;color:var(--ink-soft)}
.demo{display:flex;align-items:center;gap:var(--space-lg);justify-content:center;font-size:.9rem;color:var(--ink-soft);min-height:2.75rem}
.demo input{width:1.3rem;height:1.3rem;accent-color:var(--primary)}

/* Fin */
.done-mark{width:4.5rem;height:4.5rem;border-radius:var(--radius-pill);background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);border:var(--border-width) solid var(--primary)}
.done-mark svg{width:2.4rem;height:2.4rem}
textarea{width:100%;min-height:5.5rem;font:inherit;font-size:1rem;padding:var(--space-xl);border-radius:var(--radius-md);border:var(--border-width) solid var(--ink-soft);background:var(--surface);color:var(--ink);resize:vertical}
label.field{display:flex;flex-direction:column;gap:var(--space-sm);font-weight:700}
label.field span.opt{font-weight:400;color:var(--ink-soft)}

/* Semaine */
.chart{position:relative;padding-top:1.6rem}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-soft);opacity:.6}
.goal-tag{position:absolute;right:0;top:0;font-size:.8rem;color:var(--ink-soft)}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-sm);height:10rem;align-items:end;position:relative}
.week li{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:var(--space-xs)}
.bar-val{font-size:.85rem;font-weight:700}
.bar{width:100%;max-width:2.4rem;border-radius:var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-sm);background:var(--primary);min-height:.5rem}
.bar.rest{background:transparent;border:2px dotted var(--line);height:.6rem!important;border-radius:var(--radius-sm)}
[data-contrast="high"] .bar.rest{border-color:#000}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-sm);margin-top:var(--space-sm);text-align:center;font-size:.85rem;color:var(--ink-soft)}
.week-days span.today{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.daylist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.daylist li{display:flex;justify-content:space-between;gap:var(--space-3xl);padding:var(--space-xl) 0;border-bottom:1px solid var(--line)}
.daylist li:last-child{border-bottom:0}
.daylist .d{font-weight:700;text-transform:capitalize}
.daylist .v{text-align:right}
.daylist .v span{display:block;color:var(--ink-soft);font-size:.9rem}

/* Réglages */
.group{display:flex;flex-direction:column;gap:var(--space-xl)}
.group > h2{margin-top:var(--space-2xs)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3xl);padding:var(--space-2xl);background:var(--surface);border:var(--border-width) solid var(--line);border-radius:var(--radius-lg)}
.setting-label{display:block;font-weight:700;font-size:1.05rem}
.setting .desc{display:block;color:var(--ink-soft);font-size:.92rem;margin-top:var(--space-2xs)}
.switch{flex:none;display:inline-flex;align-items:center;gap:var(--space-md);min-height:3rem;min-width:7rem;padding:var(--space-xs) var(--space-xl) var(--space-xs) var(--space-xs);border-radius:var(--radius-pill);
  border:var(--border-width) solid var(--ink-soft);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.switch .knob{width:2.2rem;height:2.2rem;border-radius:var(--radius-pill);background:var(--line);transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);flex-direction:row-reverse;padding:var(--space-xs) var(--space-xs) var(--space-xs) var(--space-xl)}
.switch[aria-checked="true"] .knob{background:var(--primary-ink)}
[data-contrast="high"] .switch[aria-checked="true"]{border-color:#000}
.preview{padding:var(--space-2xl);border-radius:var(--radius-md);background:var(--bg);border:1px solid var(--line)}
.inline-confirm{display:flex;flex-direction:column;gap:var(--space-lg);padding:var(--space-2xl);border:var(--border-width) solid var(--warn-line);border-radius:var(--radius-lg);background:var(--warn-bg)}

/* Barre d'onglets */
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:var(--border-width) solid var(--line);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2xs);min-height:4.2rem;background:none;border:0;
  font:inherit;font-size:.88rem;font-weight:700;color:var(--ink-soft);cursor:pointer;position:relative;padding:var(--space-sm) var(--space-2xs)}
.tab svg{width:1.6rem;height:1.6rem}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--primary)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);padding:var(--space-2xl) 1.2rem;border-radius:var(--radius-md);font-weight:700;max-width:calc(100% - 2rem);text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.18)}
[data-contrast="high"] .toast{background:#000;color:#fff;border:3px solid #fff;outline:3px solid #000}
@media (min-width:900px){.toast{position:absolute}}

/* Bienvenue */
.welcome .brand{font-size:2.6rem;letter-spacing:-.02em}
.welcome .trail{margin:0 calc(-1 * var(--space-gutter));width:calc(100% + 2.5rem);max-width:none}

/* Onboarding */
.brand-block{display:flex;align-items:center;gap:var(--space-xl);margin-top:var(--space-md)}
.logo{width:3.6rem;height:3.6rem;flex:none}
.logo .l-bg{fill:var(--primary)}
.logo .l-a{fill:var(--primary-ink)}
.logo .l-b{fill:var(--illus-accent)}
.app-name{font-weight:700;font-size:1.15rem;color:var(--primary)}
.ob-title{font-size:1.75rem;line-height:1.2}
.device-ok{border-color:var(--primary);background:var(--primary-soft);display:flex;flex-direction:column;gap:var(--space-lg)}
.device-ok p{margin:0}

/* Accueil : statistiques */
.sec-title{font-size:1.15rem;line-height:1.3;margin:var(--space-2xl) 0 var(--space-md)}
.screen > .sec-title + *{margin-top:calc(-1 * var(--space-3xl))}
.stats3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-md)}
.stat,.kpi{min-width:0;padding:var(--metric-pad);display:flex;flex-direction:column;align-items:center;gap:var(--metric-gap);text-align:center}
.stat{background:var(--card-bg);border:var(--border-width) solid var(--card-border);border-radius:var(--radius-lg)}
.stat-ico{width:2rem;height:2rem;color:var(--primary)}
.stat-label{font-weight:700;font-size:.95rem}
.stat-goal{font-size:.8rem;color:var(--ink-soft);line-height:1.2}
.ring{width:5rem;height:5rem;border-radius:var(--radius-pill);display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--illus-line) 0)}
.ring span{width:3.9rem;height:3.9rem;border-radius:var(--radius-pill);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.95rem;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.kv-label{font-weight:700;color:var(--ink-soft);font-size:.95rem}
.big{font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--ink-soft)}
.days{list-style:none;margin:var(--space-2xl) 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-2xs);text-align:center}
.days li{display:flex;flex-direction:column;align-items:center;gap:var(--space-sm);min-width:0}
.days .ini{font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.days li.today .ini{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.tick{width:2.1rem;height:2.1rem;border-radius:var(--radius-pill);display:grid;place-items:center;border:2px solid var(--line);color:var(--primary-ink)}
.tick svg{width:1.1rem;height:1.1rem}
.days li.walked .tick{background:var(--primary);border-color:var(--primary)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-lg)}
.kpi{--metric-gap:var(--space-2xs)}
.kpi .kv-label{font-size:.78rem;line-height:1.2;hyphens:auto}
.kpi .big{font-size:1.6rem}
.kpi .small{font-size:.8rem}

/* Navigation et écrans secondaires */
.tab{font-size:.78rem}
.tab svg{width:1.5rem;height:1.5rem}
.hello-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3xl)}
.icon-btn{--btn-bg:var(--surface);--btn-ink:var(--ink);--btn-border:var(--line);flex:none;width:var(--iconbtn-size);height:var(--iconbtn-size);border-radius:var(--iconbtn-radius);border:var(--border-width) solid var(--btn-border);background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:1.5rem;height:1.5rem}
.challenge{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);text-align:center}
.challenge-title{font-size:1.3rem;font-weight:700}
.walks{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-xl)}
.walk-item{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl)}
.walk-item p{margin:0}
.walk-btn{width:auto;min-height:2.9rem;padding:var(--space-md) var(--space-2xl);font-size:1rem;flex:none}

/* Ligne de 3 cartes : jours réduits */
.trio{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:var(--space-md)}
.trio .kpi{padding:var(--space-xl) var(--space-xs)}
.trio .big{font-size:1.35rem}
.days.mini{margin-top:var(--space-lg);gap:0}
.days.mini li{gap:var(--space-xs)}
.days.mini .ini{font-size:.68rem}
.days.mini .tick{width:.95rem;height:.95rem;border-width:1.5px}
.days.mini .tick svg{width:.6rem;height:.6rem}

/* Barre à 4 entrées */
.tab{font-size:.78rem}
.tab svg{width:1.5rem;height:1.5rem}

/* En-tête de l'accueil */
.app-header{display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);position:sticky;top:0;z-index:6;background:var(--bg);padding-top:var(--space-sm);padding-bottom:var(--space-sm)}
.brand-mini{display:flex;align-items:center}
.logo-sm{width:2.3rem;height:2.3rem}
.header-icons{display:flex;gap:var(--space-sm)}
.header-icons .icon-btn{width:2.75rem;height:2.75rem;position:relative}
.header-icons svg{width:1.35rem;height:1.35rem}
.badge-dot{position:absolute;top:.35rem;right:.35rem;width:.6rem;height:.6rem;border-radius:var(--radius-pill);background:var(--primary);border:2px solid var(--surface)}
.sync-ico{transform-origin:50% 50%}
.icon-btn.is-syncing .sync-ico{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.icon-btn.is-syncing .sync-ico{animation:none}}
[data-motion="reduce"] .icon-btn.is-syncing .sync-ico{animation:none}

/* Création de compte */
.signup{display:flex;flex-direction:column;gap:var(--space-2xl);text-align:left}
.field input{font:inherit;font-size:1.1rem;font-weight:400;min-height:3.2rem;padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-md);border:var(--border-width) solid var(--ink-soft);background:var(--surface);color:var(--ink)}
.field input::placeholder{color:var(--ink-soft);opacity:1}

/* Drawer de connexion */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88dvh;overflow-y:auto;background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:var(--space-lg) var(--space-gutter) calc(var(--space-gutter) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--space-2xl);box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:sheetUp .25s ease-out}
[data-contrast="high"] .sheet{border-top:3px solid #000}
@media (min-width:900px){.sheet-backdrop,.sheet{position:absolute}}
.sheet-grip{width:3rem;height:.35rem;border-radius:var(--radius-sm);background:var(--line);margin:0 auto}
.sheet h2{font-size:1.4rem}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
[data-motion="reduce"] .sheet{animation:none}

/* Onboarding : boutons fixes en bas */
.screen.ob .actions{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:var(--space-xl) 0 calc(var(--space-xl) + env(safe-area-inset-bottom,0px));margin-top:auto}

/* Accueil de l'onboarding centré */
.screen.welcome{justify-content:center;text-align:center}
.screen.welcome .brand-block{justify-content:center;margin:auto 0 0}
.screen.welcome .ob-title{margin:0 0 auto}
.screen.welcome .actions{margin-top:0}

.btn-ico{width:1.3rem;height:1.3rem;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Schéma de progression */
.track-wrap{display:flex;flex-direction:column;gap:var(--space-md);margin:var(--space-lg) 0 var(--space-2xs)}
.track{position:relative;height:var(--track-h);border-radius:var(--radius-pill);background:var(--track-bg)}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--primary);transition:width .6s ease}
.track-foot{position:absolute;top:50%;transform:translate(-50%,-50%);width:2.2rem;height:2.2rem;border-radius:var(--radius-pill);background:var(--surface);border:var(--border-width) solid var(--primary);display:grid;place-items:center;color:var(--primary);transition:left .6s ease}
.track-foot svg{width:1.2rem;height:1.2rem}
.track-scale{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.ring small{font-size:.72rem;font-weight:400;color:var(--ink-soft);line-height:1}

.stat-btn{appearance:none;font:inherit;color:var(--ink);cursor:pointer;width:100%}

/* Page Pas */
.topbar.pas-top{justify-content:space-between;gap:var(--space-lg)}
.topbar.pas-top h1{font-size:1.5rem;margin:0;flex:1;text-align:center}
.help-btn.balance{visibility:hidden}
.seg-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--seg-gap);background:var(--surface);border:var(--border-width) solid var(--line);border-radius:var(--seg-radius);padding:var(--space-xs)}
.seg-opt{appearance:none;min-height:2.9rem;border:0;border-radius:var(--seg-opt-radius);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg-opt[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.pchart{display:flex;flex-direction:column;gap:var(--space-sm);margin-top:var(--space-xl)}
.pc-area{position:relative;height:10rem;display:flex;align-items:flex-end;gap:var(--space-sm)}
.pc-bar{flex:1;max-width:2.8rem;margin:0 auto;background:var(--primary);border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) var(--radius-sm);min-height:.3rem}
.pc-goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-soft);opacity:.7;pointer-events:none}
.pc-vals,.pc-labs{display:flex;gap:var(--space-sm);font-size:.7rem;color:var(--ink-soft);text-align:center;font-variant-numeric:tabular-nums}
.pc-vals span,.pc-labs span{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.pc-labs span{color:var(--ink);font-weight:700}

.day-nav{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md)}
.day-nav .icon-btn:disabled{opacity:.35;cursor:not-allowed}
.day-label{font-weight:700;font-size:1.05rem;text-align:center;flex:1}

.big-ring{width:12rem;height:12rem;margin:var(--space-xl) auto var(--space-sm);border-radius:var(--radius-pill);display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--illus-line) 0)}
.big-ring-in{width:9.4rem;height:9.4rem;border-radius:var(--radius-pill);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2xs)}
.big-ring-in strong{font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.big-ring-in small{color:var(--ink-soft);font-size:1rem}
.goal-ok{display:inline-flex;align-items:center;gap:var(--space-xs);color:var(--primary);font-weight:700;margin-top:var(--space-2xs)}
.goal-ok svg{width:1.1rem;height:1.1rem}
.pct-line{text-align:center;font-weight:700}

.pc-col{position:relative;flex:1;max-width:2.8rem;margin:0 auto;height:100%}
.pc-track{position:absolute;left:0;right:0;bottom:0;border-radius:var(--radius-sm) var(--radius-sm) var(--radius-sm) var(--radius-sm);background:var(--illus-line)}
.pc-col .pc-bar{position:absolute;left:0;right:0;bottom:0;max-width:none;margin:0}

.pas-totals{margin-top:var(--space-2xs)}
.day-list{display:grid;gap:var(--space-lg)}
.day-card{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl);padding:var(--space-2xl) var(--space-2xl)}
.day-card p{margin:0}
.dc-name{font-weight:700;font-size:1.05rem}
.dc-mid{text-align:right;flex:1}
.dc-pct{font-weight:inherit;font-size:inherit;color:inherit;margin-left:var(--space-xs);font-variant-numeric:tabular-nums}
.dc-steps{font-weight:700;font-size:.95rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.dc-ring{width:20px;height:20px;border-radius:var(--radius-pill);flex:none;background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--illus-line) 0);display:grid;place-items:center}
.dc-ring span{width:14px;height:14px;border-radius:var(--radius-pill);background:var(--surface);display:grid;place-items:center;color:var(--primary)}
.dc-ring svg{width:10px;height:10px}

.help-btn{margin-left:auto;appearance:none;background:none;border:0;color:var(--primary);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:4px;min-height:2.75rem;padding:0 var(--space-2xs);cursor:pointer}

.pas-link{cursor:pointer}
.pas-link:focus-visible{outline:4px solid var(--focus);outline-offset:3px}

.profile-id{display:flex;align-items:center;gap:var(--space-2xl)}
.profile-id p{margin:0}
.profile-name{font-weight:700;font-size:1.2rem}
.avatar{width:3.5rem;height:3.5rem;border-radius:var(--radius-pill);background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:1.5rem;flex:none}

/* Challenges */
.ch-list{display:grid;gap:var(--space-xl)}
.ch-item{display:flex;flex-direction:column;gap:var(--space-md)}
.ch-item p{margin:0}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-md)}
.badge,.chip,.bal-tag{display:inline-flex;align-items:center;font-size:var(--tag-size);font-weight:700;padding:var(--tag-pad);border-radius:var(--tag-radius);border:1px solid var(--tag-border);background:var(--tag-bg);color:var(--tag-ink)}
.prog{height:.6rem;border-radius:var(--radius-pill);background:var(--illus-line);overflow:hidden}
.prog > div{height:100%;background:var(--primary);border-radius:var(--radius-pill)}
.ch-accept{width:100%}
.share-preview{display:flex;flex-direction:column;align-items:center;gap:var(--space-md);text-align:center}
.share-preview p{margin:0}
.code-box{font-size:1.6rem;font-weight:700;letter-spacing:.15em;padding:var(--space-lg) var(--space-2xl);border:2px dashed var(--ink-soft);border-radius:var(--radius-md)}
.qr{width:9rem;height:9rem;color:var(--ink);background:var(--surface)}
.ch-nav{margin-top:var(--space-md)}
.ch-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.ch-tabs .seg-opt{font-size:.85rem;line-height:1.2;padding:var(--space-sm) var(--space-2xs);white-space:normal}

.theme-list{display:flex;flex-wrap:wrap;gap:var(--space-md)}

/* Parcourir : rangées défilantes */
.parc .row{margin-top:var(--space-2xs)}
.rail{display:flex;gap:var(--space-xl);overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 var(--space-md);margin:0 calc(-1 * var(--space-gutter));padding-left:var(--space-gutter);padding-right:var(--space-gutter);scroll-padding:0 1.25rem}
.rail{scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.row-title{display:flex;align-items:center;gap:var(--space-xs);margin:var(--space-2xl) 0 var(--space-md)}
.chev{width:1.1rem;height:1.1rem;color:var(--ink-soft);flex:none}
.rcard{flex:0 0 42%;max-width:170px;height:11.5rem;scroll-snap-align:start;background:var(--card-bg);border:var(--border-width) solid var(--card-border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.rcard .vis, .vis{height:5rem;display:grid;place-items:center}
.rcard .vis svg{width:2.2rem;height:2.2rem}
.vis.v1{background:var(--primary-soft);color:var(--primary)}
.vis.v2{background:var(--warn-bg);color:var(--warn-line)}
.vis.v3{background:var(--illus-fill);color:var(--ink)}
.rbody{flex:1;display:flex;align-items:flex-start;padding:var(--space-lg) var(--space-xl) var(--space-xl);font-weight:700;font-size:.92rem;line-height:1.3}
.dc-cta{display:flex;flex-direction:column;gap:var(--space-lg);padding:0;overflow:hidden;margin-top:var(--space-md)}
.dc-cta .vis{height:6.5rem}
.dc-cta h2{padding:0 var(--space-2xl);margin:0}
.dc-cta p{padding:0 var(--space-2xl);margin:0}
.dc-cta .btn{margin:0 var(--space-2xl) var(--space-2xl)}

.pedo-row{display:flex;align-items:center;gap:var(--space-2xl)}
.pedo-row p{margin:0}
.pedo-vis{width:3.2rem;height:3.2rem;border-radius:var(--radius-pill);background:var(--bg);border:var(--border-width) solid var(--line);color:var(--ink-soft);display:grid;place-items:center;flex:none}
.pedo-vis.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.pedo-vis svg{width:1.5rem;height:1.5rem}

.btn.danger{--btn-bg:transparent;--btn-ink:var(--danger);--btn-border:var(--danger)}

.empty-card{text-align:center;display:flex;flex-direction:column;gap:var(--space-sm);align-items:center}
.empty-card p{margin:0}

/* Texte agrandi : les cartes côte à côte passent en pleine largeur */
html[data-text="large"] .stats3,
html[data-text="large"] .trio,
html[data-text="xlarge"] .stats3,
html[data-text="xlarge"] .trio{grid-template-columns:minmax(0,1fr)}

/* Panneau de démonstration : rester dans la largeur */
.proto, .proto *{min-width:0;max-width:100%}

/* Texte agrandi : tout s'adapte sans déborder */
.tab span{overflow-wrap:anywhere;line-height:1.2}
.topbar.pas-top{flex-wrap:nowrap;min-width:0}
.topbar.pas-top h1{font-size:1.3rem;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.help-btn{flex:none;white-space:nowrap}
.seg-opt{white-space:normal;overflow-wrap:anywhere;line-height:1.2;min-width:0}
.seg-bar{min-width:0}
.rcard{min-height:11.5rem;height:auto}
.rbody{overflow-wrap:anywhere}
.daylist li{flex-wrap:wrap;min-width:0}
.daylist .v{min-width:0;overflow-wrap:anywhere}
.setting{flex-wrap:wrap;min-width:0}
.setting > div{min-width:0;flex:1 1 10rem}
.switch{flex:none}
.seg span{overflow-wrap:anywhere;min-width:0}
.seg small{overflow-wrap:anywhere}
.pc-vals span,.pc-labs span{overflow-wrap:normal}
.card, .kpi, .stat{min-width:0;overflow-wrap:anywhere}
.stat-label, .stat-goal{overflow-wrap:anywhere}
.day-nav .day-label{overflow-wrap:anywhere;min-width:0}
.ch-head{flex-wrap:wrap}
.ch-accept{min-height:3.4rem}
.dc-cta .btn{width:calc(100% - 2rem)}
.pc-vals span{white-space:normal;overflow-wrap:anywhere;font-size:.62rem;line-height:1.2}
.pc-labs span{white-space:normal;overflow-wrap:anywhere}
h1,h2,h3,p,label,legend,strong,span{overflow-wrap:break-word}
.btn{white-space:normal;overflow-wrap:anywhere}

.reco-card{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.reco-vis{width:6rem;height:auto;min-height:6rem;flex:none}
.reco-vis svg{width:2.2rem;height:2.2rem}
.reco-text{padding:var(--space-2xl) var(--space-2xl);display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.reco-text p{margin:0}

.shortcuts{display:flex;flex-direction:column;gap:var(--space-xl)}
.shortcut{display:flex;align-items:stretch;padding:0;overflow:hidden;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.shortcut .reco-text{justify-content:center}
.shortcut strong{font-size:1.05rem}
.shortcut .small{margin:0}

.pas-back{flex:none}
.pas-back svg{width:1.3rem;height:1.3rem}

/* Balades */
.bal-card{display:flex;flex-direction:column;padding:0;overflow:hidden}
.bal-vis{height:6.5rem}
.bal-vis .bal-svg{width:70%;height:70%}
.bal-body{padding:var(--space-xl) var(--space-2xl);display:flex;flex-direction:column;gap:var(--space-sm)}
.bal-body p{margin:0}

.defi-rlink{background:transparent;border:0;padding:0;color:var(--primary);font:inherit;font-size:.9rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:auto}

.row-hint{margin:0 0 var(--space-md)}
.defi-rcard-desc{flex:0 0 82%;width:82%;max-width:none;height:auto;min-height:12.5rem;display:flex;flex-direction:column;gap:var(--space-sm);text-align:left}
.defi-rcard-desc .rbody{display:flex;flex-direction:column;gap:var(--space-xs)}
.defi-desc{display:block;margin-top:var(--space-xs);line-height:1.3;font-weight:400}
.sq-rail .sq-card{--card-width:8.6rem;--card-bg:var(--primary-soft);flex:0 0 var(--card-width);width:var(--card-width);height:var(--card-width);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;padding:var(--space-lg);border-radius:var(--radius-lg);border:var(--border-width) solid var(--card-border);background:var(--card-bg);color:var(--primary);font:inherit;font-size:.92rem;font-weight:700;line-height:1.2;text-align:center;cursor:pointer;scroll-snap-align:start}

.sq-text{overflow-wrap:break-word;hyphens:auto}
.sq-btn{background:transparent;border:0;padding:var(--space-2xs) var(--space-xs);margin-top:var(--space-xs);color:var(--primary);font:inherit;font-size:.85rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sq-card.is-done .sq-btn{color:var(--ink-soft)}
.sq-card{flex-direction:column}
.sq-check{position:absolute;top:.4rem;right:.4rem;width:1.3rem;height:1.3rem;border-radius:var(--radius-pill);background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.sq-check svg{width:.8rem;height:.8rem;stroke-width:3}

.dc-cta{display:flex;flex-direction:row;align-items:center;gap:var(--space-2xl);padding:var(--space-xl)}
.dc-cta-vis{flex:none;width:4.8rem;height:4.8rem;border-radius:var(--radius-md)}

.dc-cta-text{display:flex;flex-direction:column;gap:var(--space-sm);min-width:0;flex:1}
.dc-cta-text h2{margin:0;font-size:1.05rem}
.dc-cta-text p{margin:0}
.dc-cta-text .btn{align-self:flex-start;width:auto;height:auto;min-height:2.6rem;padding:var(--space-sm) var(--space-2xl);font-size:.95rem}

/* Mouvement */
[data-motion="reduce"] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sync-card{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem}
.sync-card p{margin:0}
.spinner{width:2rem;height:2rem;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:spin 0.9s linear infinite}

[data-motion="reduce"] .spinner{animation:none}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <details class="proto" id="proto" open>
    <summary>Écrans du prototype</summary>
    <ol id="proto-list"></ol>
    <p class="proto-note">Données fictives. Bluetooth et notifications sont simulés dans ce prototype.</p>
  </details>
  <main class="phone" id="phone" aria-label="Application Pas à pas">
    <div class="scroller" id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="drawer-root"></div>
  </main>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
(function(){
"use strict";
const LS_KEY = "pasapas-v1";
const GOAL = 10;

const LEVELS = {
  doux: {
    title: "Marcher peu, commencer doucement",
    steps: 5000,
    desc: "Je marche peu et je veux commencer doucement.",
    reco: "Visez 5 000 pas aujourd'hui. Découpez-les en deux balades courtes, avec une pause assise entre les deux."
  },
  progresser: {
    title: "Marcher et progresser",
    steps: 7000,
    desc: "Je marche déjà et je veux progresser petit à petit.",
    reco: "Visez 7 000 pas aujourd'hui. Ajoutez un petit tour à votre marche habituelle, à un rythme où vous pouvez parler."
  },
  accomp: {
    title: "Marcher régulièrement, à plusieurs",
    steps: 10000,
    desc: "Je marche régulièrement et je veux le faire avec d'autres personnes.",
    reco: "Visez 10 000 pas aujourd'hui. Proposez à un proche ou à un groupe une balade, un tour du quartier ou du parc."
  }
};
const FEEL = {
  bien: { label: "Je me sens bien", short: "Bien" },
  fatigue: { label: "Un peu de fatigue", short: "Un peu de fatigue" },
  gene: { label: "J'ai ressenti une gêne", short: "Une gêne" }
};
const DAY = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const DAY_S = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const SCREENS = [
  ["onboarding","Onboarding"],["home","Accueil"],
  ["walk","Marche en cours"],["settings","Réglages"],["pas-a-pas","Pas à pas"],["balades","Balades"],["balade","Balade"],["activite","Activité"],["podometre","Podomètre"],["profile","Profil"],["parcourir","Parcourir"]
];

function todayKey(){ const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function blankWeek(){ return buildWeek().map(d => ({ ...d, min: 0, feel: null })); }
function buildWeek(){
  const base = [[12,"bien"],[0,null],[8,"fatigue"],[10,"bien"],[0,null],[15,"bien"]];
  const out = []; const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const pair = i === 0 ? [0,null] : base[6 - i];
    out.push({ dow: d.getDay(), date: d.getDate(), min: pair[0], feel: pair[1], today: i === 0 });
  }
  return out;
}

const state = {
  screen: "onboarding", obStep: 0, name: "", pedo: null, scanning: false, scanFound: false, notif1: false, notif2: false, locAuth: false, signup: false, signupError: false, phone: "", sheet: null, syncing: false, syncDone: false, pasPeriod: "7j", goalMetric: "duree", balTab: "explorer", balMode: "all", defisValides: {}, balDone: 0, chCat: "etapes", balSearch: { scope: "near", city: "" }, campJoined: [], votes: {}, exploPick: null, exploTrack: null, balFollowed: [], balJoined: [], observations: 0, balShare: null, obsPhoto: false, isNew: false, kit: {}, dcMine: [], dcCreate: null, chTab: "mine", chCreate: null, loginStep: "phone", loginPhone: "", signupMode: false, signupName: "", helpKind: "pas", pasDay: 1, pasWeek: 0, pasBlock: 0,
  level: null, consent: null, onboarded: false,
  textSize: "normal", contrast: false, motion: false,
  duration: GOAL, elapsed: 0, running: false, demo: false, goalAnnounced: false,
  feeling: null, note: "", lastMinutes: 0,
  week: buildWeek(), confirmClear: false, obError: false
};

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return;
    const s = JSON.parse(raw);
    ["level","consent","onboarded","textSize","contrast","motion","notif1","notif2","pedo","isNew","name","goalMetric","locAuth","defisValides","balDone","walksDone","syncCount"].forEach(k => { if (k in s) state[k] = s[k]; });
    if (state.isNew) state.week = blankWeek();
    if (!LEVELS[state.level]) state.level = null;
    if (s.today && s.today.key === todayKey()) {
      const t = state.week[6]; t.min = s.today.min || 0; t.feel = s.today.feel || null;
    }
  } catch(e) {}
}
function save(){
  try {
    const t = state.week[6];
    localStorage.setItem(LS_KEY, JSON.stringify({
      level: state.level, consent: state.consent, onboarded: state.onboarded,
      textSize: state.textSize, contrast: state.contrast, motion: state.motion, isNew: state.isNew, name: state.name, goalMetric: state.goalMetric, locAuth: state.locAuth, defisValides: state.defisValides, balDone: state.balDone, walksDone: state.walksDone, syncCount: state.syncCount,
      notif1: state.notif1, notif2: state.notif2, pedo: state.pedo,
      today: state.consent ? { key: todayKey(), min: t.min, feel: t.feel } : null
    }));
  } catch(e) {}
}
function applyPrefs(){
  const r = document.documentElement;
  r.dataset.text = state.textSize;
  r.dataset.contrast = state.contrast ? "high" : "normal";
  r.dataset.motion = state.motion ? "reduce" : "normal";
}

/* Utilitaires */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
const pad = n => String(n).padStart(2,"0");
function fmt(sec){ return pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
function spoken(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return (m ? plural(m,"minute") : "") + (m && s ? " et " : "") + (s || !m ? plural(s,"seconde") : "");
}
function announce(msg){ const l = document.getElementById("live"); l.textContent = ""; setTimeout(() => { l.textContent = msg; }, 60); }
let toastT = null;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

/* Icônes */
const I = {
  compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 21h6M10 17h4"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',
  rec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

function trail(p, withSun){
  const d = "M24 150 C 90 150, 70 112, 140 106 S 214 82, 236 62 S 276 40, 296 34";
  return `<svg class="trail" data-p="${Math.max(0,Math.min(1,p))}" viewBox="0 0 320 170" aria-hidden="true" focusable="false">
    ${withSun ? '<circle class="sun" cx="250" cy="34" r="22"/>' : ''}
    <path class="h1" d="M0 112 Q 80 64 170 98 T 320 74 V170 H0Z"/>
    <path class="h2" d="M0 146 Q 110 108 210 136 T 320 126 V170 H0Z"/>
    <path class="trail-base" pathLength="100" d="${d}"/>
    <path class="trail-prog" pathLength="100" d="${d}"/>
    <g class="trail-flag" transform="translate(296 34)"><line x1="0" y1="0" x2="0" y2="-26"/><path d="M0 -26 L17 -20 L0 -14Z"/></g>
    <g class="trail-marker"><circle r="11"/><circle class="dot" r="4"/></g>
  </svg>`;
}
function placeTrails(){
  document.querySelectorAll(".trail").forEach(svg => {
    const p = parseFloat(svg.dataset.p) || 0;
    const base = svg.querySelector(".trail-base");
    svg.querySelector(".trail-prog").style.strokeDashoffset = String(100 - p*100);
    const L = base.getTotalLength(); const pt = base.getPointAtLength(L * p);
    svg.querySelector(".trail-marker").setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
  });
}

function backBtn(to, label){ return `<button class="back" data-action="go" data-to="${to}">${I.back}<span>${label || "Retour"}</span></button>`; }
function safety(text){ return `<div class="note">${I.info}<p>${text}</p></div>`; }
function tabbar(cur){
  const t = [["home","Accueil",I.home],["pas-a-pas","Pas à pas",I.trophy],["balades","Balades",I.pin],["parcourir","Parcourir",I.compass]];
  return `<nav class="tabbar" aria-label="Navigation principale">${t.map(([k,l,i]) =>
    `<button class="tab" data-action="go" data-to="${k}" ${cur===k?'aria-current="page"':''}>${i}<span>${l}</span></button>`).join("")}</nav>`;
}

/* Écrans */
const V = {};

const OB_TOTAL = 5;
const DEVICES = ["Podomètre Pas à pas (démo)", "Montre connectée (démo)"];
const DEVICE_INFO = {
  "Podomètre Pas à pas (démo)": { model: "PAP-200 Bluetooth", fw: "2.1.4", battery: 82, signal: "Fort" },
  "Montre connectée (démo)": { model: "Montre Active Demo 3", fw: "5.0.2", battery: 56, signal: "Moyen" }
};
const LOGO = '<svg class="logo" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><rect class="l-bg" width="96" height="96" rx="28"/><ellipse class="l-a" cx="36" cy="40" rx="8" ry="13" transform="rotate(-12 36 40)"/><ellipse class="l-b" cx="60" cy="58" rx="8" ry="13" transform="rotate(-12 60 58)"/></svg>';
function obTop(s){
  if (s === 0) return "";
  const back = s === 0 ? "<span></span>" : `<button class="back" data-action="ob-back">${I.back}<span>Retour</span></button>`;
  const dots = Array.from({length: OB_TOTAL}, (_, i) => `<span class="${i <= s ? "on" : ""}"></span>`).join("");
  return `<div class="topbar">${back}<p class="steps">Étape ${s+1} sur ${OB_TOTAL}</p></div><div class="dots" aria-hidden="true">${dots}</div>`;
}

V.onboarding = () => {
  const s = state.obStep;
  const err = `<p class="error" role="alert" ${state.obError ? "" : "hidden"}>Choisissez un objectif pour continuer.</p>`;

  if (s === 0) return `<section class="screen ob welcome">${obTop(0)}
    <div class="brand-block">${LOGO}<p class="app-name">D-marche</p></div>
    <h1 class="ob-title" tabindex="-1" data-focus>Un petit pas de plus au quotidien, un grand pas pour votre santé</h1>
    <div class="actions"><button class="btn primary" data-action="signup-open" aria-haspopup="dialog">Créer un compte</button><button class="btn quiet" data-action="login" aria-haspopup="dialog">Connexion</button></div></section>`;

  if (s === 1) return `<section class="screen ob">${obTop(1)}
    <h1 id="ob-t" tabindex="-1" data-focus>Quel rythme vous convient le mieux&nbsp;?</h1>
    <fieldset class="choices" aria-labelledby="ob-t">${Object.entries(LEVELS).map(([k,v]) =>
      `<label class="choice"><input type="radio" name="level" value="${k}" ${state.level===k?"checked":""}><span><strong>${v.title}</strong><span class="desc">${v.desc}</span></span></label>`).join("")}
    </fieldset>${err}
    <div class="actions"><button class="btn primary" data-action="ob-next">Continuer</button></div></section>`;

  if (s === 2) return `<section class="screen ob">${obTop(2)}
    <h1 id="gm-t" tabindex="-1" data-focus>Comment observer votre évolution&nbsp;?</h1>
    <fieldset class="choices" aria-labelledby="gm-t">${[["duree", "Durée", "Minutes de marche par jour"], ["sorties", "Nombre de sorties", "Sorties de marche par jour"], ["pas", "Nombre de pas", "Pas par jour"]].map(([k, l, d]) =>
      `<label class="choice"><input type="radio" name="goal-metric" value="${k}" ${(state.goalMetric || "duree") === k ? "checked" : ""}><span><strong>${l}</strong><span class="desc">${d}</span></span></label>`).join("")}
    </fieldset>
    <div class="actions"><button class="btn primary" data-action="ob-next">Continuer</button></div></section>`;

  if (s === 3) {
    let block;
    if (state.pedo && state.onbSync !== "done") {
      block = `<div class="card sync-card" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><p><strong>Connexion en cours…</strong></p>
        <p class="small">${esc(state.pedo)} · ne fermez pas l'application.</p></div>`;
    } else if (state.pedo) {
      block = `<div class="card device-ok" role="status"><span class="ok-ico" aria-hidden="true">${icon("check")}</span><p><strong>Podomètre connecté</strong></p>
        <p class="small">${esc(state.pedo)} · le relevé automatique de vos pas est activé.</p></div>`;
    } else if (state.scanning) {
      block = `<div class="card" role="status" aria-live="polite"><p><strong>Recherche d'appareils…</strong></p>
        <p class="small">Gardez le podomètre allumé et proche du téléphone.</p></div>`;
    } else if (state.scanFound) {
      block = `<fieldset class="choices" aria-labelledby="dev-t"><h2 id="dev-t">Appareils trouvés</h2>
        <label class="choice"><input type="radio" name="device" value="0"><span><strong>${DEVICES[0]}</strong></span></label>
        </fieldset>`;
    } else {
      block = `<button class="btn secondary" data-action="pedo-scan"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg><span>Rechercher un podomètre Bluetooth</span></button>`;
    }
    return `<section class="screen ob">${obTop(3)}
      <h1 tabindex="-1" data-focus>Connectons votre podomètre</h1>
      ${block}
      <div class="actions">${state.pedo && state.onbSync === "done" ? `<button class="btn primary" data-action="ob-next">Continuer</button>` : `<button class="btn primary" data-action="pedo-connect"${state.scanFound && state.devPick != null ? "" : " disabled"}>Connecter cet appareil</button>`}</div></section>`;
  }

  return `<section class="screen ob">${obTop(4)}
    <h1 tabindex="-1" data-focus>Pour entretenir votre motivation</h1>
    ${sw("notif1", "Rappels de motivation", "Conseils et astuces pour marcher, au plus une fois par jour.", state.notif1)}
    ${sw("locAuth", "Accord pour la géolocalisation", "Autour de vous : voir les balades près de chez vous. Modifiable à tout moment.", !!state.locAuth)}
    <p class="small">Vous pouvez tout refuser. L'application reste utilisable.</p>
    <div class="actions"><button class="btn primary" data-action="ob-finish">Valider mes choix</button></div></section>`;
};

const STEP_MIN = 100, KM_PER_STEP = 0.00075;
function goalSteps(){ return LEVELS[state.level || "doux"].steps; }
function goalKm(){ return goalSteps() * KM_PER_STEP; }
const INITIALS = ["D","L","M","M","J","V","S"];
const FEEL_SCORE = { bien: 3, fatigue: 2, gene: 1 };
const nf = (n, d = 0) => n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const stepsOf = d => d.min * STEP_MIN;
const kmOf = d => stepsOf(d) * KM_PER_STEP;
function feelAvg(){
  const f = state.week.filter(d => d.feel);
  return f.length ? f.reduce((acc, d) => acc + FEEL_SCORE[d.feel], 0) / f.length : null;
}
const ICO = {
  steps: '<svg class="stat-ico" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><ellipse cx="11" cy="12" rx="5" ry="8" transform="rotate(-12 11 12)"/><ellipse cx="22" cy="22" rx="5" ry="8" transform="rotate(-12 22 22)"/></svg>',
  route: '<svg class="stat-ico" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M6 26 C 14 20, 10 12, 18 10 S 24 4, 26 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="6" cy="26" r="2.6" fill="currentColor"/><circle cx="26" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',

const PAS_PERIODS = [["1j","1j"],["7j","7j"],["4s","4s"],["1a","1a"]];
const PAS_HISTORY = [5200,6100,6800,6400,7300,6900,6100,7600,6700,7100,6500,7000];
function dayStepsAt(offset){
  if (offset < 7) return stepsOf(state.week[6 - offset]);
  return 2500 + ((offset * 37) % 9) * 300;
}
function dayLabel(offset){
  if (offset === 0) return "Aujourd'hui";
  const d = new Date(); d.setDate(d.getDate() - offset);
  const txt = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" }).replace(".", "");
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function weekRangeLabel(w){
  const end = new Date(); end.setDate(end.getDate() - w * 7);
  const start = new Date(end); start.setDate(end.getDate() - 6);
  const mon = d => d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
  const same = start.getMonth() === end.getMonth();
  return `${start.getDate()}${same ? "" : " " + mon(start)} - ${end.getDate()} ${mon(end)}`;
}
function capFirst(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
function dayParts(off){
  const d = new Date(); d.setDate(d.getDate() - off);
  return { name: capFirst(d.toLocaleDateString("fr-FR", { weekday: "long" })), date: d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) };
}
const NAV_LEFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>';
const NAV_RIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>';
function navRow(label, action, prevVal, nextVal, nextDisabled, prevLabel, nextLabel){

    </div>`;
}
function blockLabel4s(off){
  const end = new Date(); end.setDate(end.getDate() - off * 28);
  const start = new Date(end); start.setDate(end.getDate() - 27);
  const mon = d => d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
  return `${start.getDate()} ${mon(start)} - ${end.getDate()} ${mon(end)}`;
}
function blockLabel1a(off){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() - off * 12 - 11, 1);
  const last = new Date(now.getFullYear(), now.getMonth() - off * 12, 1);
  const mon = d => d.toLocaleDateString("fr-FR", { month: "short", year: "numeric" }).replace(".", "");
  return `${mon(first)} - ${mon(last)}`;
}
function pasSeries(period){
  if (period === "4s") {
    const out = [];
    for (let w = state.pasBlock * 4 + 3; w >= state.pasBlock * 4; w--) {
      let sum = 0;
      for (let k = 0; k < 7; k++) sum += dayStepsAt(w * 7 + k);
      const start = new Date(); start.setDate(start.getDate() - w * 7 - 6);
      out.push({ label: start.getDate() + " " + start.toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""), value: Math.round(sum / 7), name: "Semaine", date: weekRangeLabel(w) });
    }
    return out;
  }
  if (period === "1j") return [{ label: dayLabel(state.pasDay), value: dayStepsAt(state.pasDay), ...dayParts(state.pasDay) }];
  if (period === "7j") {
    const out = [];
    for (let k = 0; k < 7; k++) {
      const off = state.pasWeek * 7 + (6 - k), d = new Date();
      d.setDate(d.getDate() - off);
      out.push({ label: INITIALS[d.getDay()], value: dayStepsAt(off), ...dayParts(off) });
    }
    return out;
  }
  const n = period === "6m" ? 6 : 12, now = new Date(), out = [];
  const shift = period === "1a" ? state.pasBlock * 12 : 0;
  for (let i = n - 1; i >= 0; i--) {
    const m = new Date(now.getFullYear(), now.getMonth() - shift - i, 1);
    out.push({ label: m.toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""), value: PAS_HISTORY[((n - 1 - i) + state.pasBlock * 5) % PAS_HISTORY.length], name: capFirst(m.toLocaleDateString("fr-FR", { month: "long" })), date: String(m.getFullYear()) });
  }
  return out;
}

V.balades = () => {
  const mode = state.balMode || "all";
  const sr = state.balSearch || { scope: "near", city: "" };
  const q = (sr.city || "").trim();
  const geoOn = state.locAuth !== false;
  const known = BAL_LIEUX.filter(v => v.toLowerCase().includes(q.toLowerCase()));
  const noMatch = q && !known.length;
  const byCity = sr.scope === "city" && q && known.length;
  const cityOk = v => !byCity || v === q || v.toLowerCase() === q.toLowerCase() || known.includes(v);
  const diff = state.balDiff || "all";
  const diffOk = p => diff === "all" || (diff === "pour-tous" && p.hard === 0) || (diff === "moderee" && p.hard === 1) || (diff === "soutenue" && p.hard >= 2);
  const solos = mode !== "groupe" ? BAL_PARCOURS.filter(p => (noMatch || cityOk(p.ville)) && diffOk(p)) : [];
  const groupes = mode !== "solo" ? BAL_CRENEAUX.filter(c => (noMatch || cityOk(balParcours(c.parcours).ville)) && diffOk(balParcours(c.parcours))) : [];
  const active = (mode !== "all" ? 1 : 0) + (diff !== "all" ? 1 : 0);

function balCountFor(mode, diff){
  const sr = state.balSearch || { scope: "near", city: "" };
  const city = sr.scope === "city" ? (sr.city || "").trim().toLowerCase() : "";
  const cityOk = v => !city || v.toLowerCase().includes(city);
  const diffOk = p => diff === "all" || (diff === "pour-tous" && p.hard === 0) || (diff === "moderee" && p.hard === 1) || (diff === "soutenue" && p.hard >= 2);
  const solos = mode !== "groupe" ? BAL_PARCOURS.filter(p => cityOk(p.ville) && diffOk(p)).length : 0;
  const groupes = mode !== "solo" ? BAL_CRENEAUX.filter(c => { const p = balParcours(c.parcours); return cityOk(p.ville) && diffOk(p); }).length : 0;
  return solos + groupes;
}

    if (input.value.replace(/\D/g, "").length < 10) { root.querySelector(".error").hidden = false; input.focus(); return; }
    state.phone = input.value.trim(); state.sheet = null; renderDrawer(); render(false);
    toast("Numéro mis à jour (démo)");
    return;
  }
  if (a === "login-send") {
    const input = root.querySelector("input[name=login-tel]");
    if (input.value.replace(/\D/g, "").length < 10) { root.querySelector(".error").hidden = false; input.focus(); return; }
    state.loginPhone = input.value.trim(); state.loginStep = "code";
    renderDrawer(); simulateSms();
    return;
  }
  if (a === "login-resend") { simulateSms(); toast("Nouveau code envoyé (démo)"); return; }
  if (a === "login-verify") {
    const otp = root.querySelector("input[name=otp]");
    if (otp.value.trim() !== SMS_CODE) { root.querySelector(".error").hidden = false; otp.focus(); return; }
    if (state.signupMode) {
      state.name = state.signupName; state.phone = state.loginPhone;
      state.signupMode = false; state.sheet = null; state.loginStep = "phone";
      state.isNew = true; state.week = blankWeek(); state.dcMine = [];
      CH_DATA.mine = []; CH_DATA.done = [];
      state.obStep = 1; save(); renderDrawer(); render(); toast("Numéro vérifié");
      return;
    }
    state.phone = state.loginPhone; state.sheet = null; state.loginStep = "phone";
    state.isNew = false; state.week = buildWeek();
    CH_DATA.mine = JSON.parse(JSON.stringify(CH_INIT.mine)); CH_DATA.done = JSON.parse(JSON.stringify(CH_INIT.done));
    state.onboarded = true; save(); renderDrawer();
    toast("Connecté"); go("home");
    return;
  }
});

/* Rendu */
let ticker = null;
function startTicker(){ stopTicker(); ticker = setInterval(tick, 1000); }
function stopTicker(){ if (ticker) clearInterval(ticker); ticker = null; }
function tick(){
  if (!state.running) return;
  const prev = Math.floor(state.elapsed/60);
  state.elapsed += state.demo ? 30 : 1;
  const m = Math.floor(state.elapsed/60);
  if (m > prev) announce(plural(m,"minute") + " de marche.");
  if (!state.goalAnnounced && state.elapsed >= state.duration*60) {
    state.goalAnnounced = true; announce("Durée prévue atteinte. Vous pouvez continuer ou terminer.");
  }
  updateWalk();
}

function balTopbarCheck(){
  const tb = document.querySelector(".bal-topbar"), sl = document.querySelector(".bal-slider");
  if (!tb) return;
  const over = sl ? sl.getBoundingClientRect().bottom > tb.getBoundingClientRect().bottom : false;
  tb.classList.toggle("is-solid", !over);
}
window.addEventListener("scroll", balTopbarCheck, true);
function render(focus){
  const app = document.getElementById("app");
  const keep = focus === false;
  const scroller = document.querySelector(".scroller");
  const prev = keep ? { y: window.scrollY, s: scroller ? scroller.scrollTop : 0, a: app.scrollTop, rails: [...app.querySelectorAll(".rail")].map(r => r.scrollLeft) } : null;
  app.innerHTML = V[state.screen]();
  placeTrails();
  if (state.screen === "walk") updateWalk();
  document.querySelectorAll("#proto-list button").forEach(b => b.setAttribute("aria-current", b.dataset.to === state.screen ? "true" : "false"));
  const name = SCREENS.find(s => s[0] === state.screen)[1];
  document.title = name + " | Pas à pas";
  if (prev) {
    app.querySelectorAll(".rail").forEach((r, i) => { if (prev.rails[i] != null) r.scrollLeft = prev.rails[i]; });
    app.scrollTop = prev.a; if (scroller) scroller.scrollTop = prev.s; window.scrollTo(0, prev.y);
  } else { app.scrollTop = 0; if (scroller) scroller.scrollTop = 0; window.scrollTo(0,0); }
  balTopbarCheck();
  if (focus !== false) { const h = app.querySelector("[data-focus]"); if (h) h.focus({preventScroll:true}); }
}

function go(to){
  if (state.screen === "walk" && to !== "walk") { state.running = false; stopTicker(); }
  if (to === "onboarding" && state.screen !== "onboarding") { state.obStep = 0; state.obError = false; state.locAuth = false; }
  if (to === "walk" && !state.running) { state.running = true; startTicker(); }
  state.confirmClear = false;
  state.screen = to; render();
}
