document.getElementById("app").addEventListener("focusout", e => {
  if (e.target && e.target.name === "bal-q") setTimeout(() => { const box = document.getElementById("bal-suggest"); if (box) box.hidden = true; }, 150);
});
document.getElementById("app").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.name === "bal-q") {
    const v = e.target.value.trim();
    state.balSearch = { scope: v ? "city" : "near", city: v }; state.balLocMsg = null; render(false);
  }
});
document.getElementById("app").addEventListener("scroll", e => {
  const sl = e.target;
  if (!sl || !sl.classList || !sl.classList.contains("bal-slides")) return;
  const w = sl.clientWidth || 1, total = sl.children.length;
  const idx = Math.min(total, Math.max(1, Math.round(sl.scrollLeft / w) + 1));
  const dots = sl.parentElement.querySelectorAll(".bal-dots span");
  dots.forEach((d, i) => d.classList.toggle("on", i === idx - 1));
  const box = sl.parentElement.querySelector(".bal-dots");
  if (box) box.setAttribute("aria-label", `Diapositive ${idx} sur ${total}`);
}, true);
document.getElementById("app").addEventListener("click", e => {
  const an = e.target.closest("[data-anchor]");
  if (an) { e.preventDefault(); const t = document.getElementById(an.dataset.anchor); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action;
  if (a === "go") return go(b.dataset.to);
  if (a === "ob-next") {
    const ok = state.obStep === 1 ? !!state.level : true;
    if (!ok) { state.obError = true; render(false); document.querySelector(".error")?.focus?.(); return; }
    state.obError = false; state.scanning = false; state.scanFound = false; state.obStep++; render(); return;
  }
  if (a === "ob-back") { state.obError = false; state.obStep = Math.max(0, state.obStep - 1); render(); return; }
  if (a === "ob-finish") { state.onboarded = true; save(); go("home"); return; }
  if (a === "start-walk") { state.balDone = (state.balDone || 0) + 1; save(); state.elapsed = 0; state.goalAnnounced = false; state.feeling = null; state.note = ""; state.lastMinutes = 0; state.running = true; state.screen = "walk"; render(); startTicker(); return; }
  if (a === "toggle-pause") { state.running = !state.running; announce(state.running ? "Marche reprise." : "Marche en pause."); updateWalk(); return; }
  if (a === "end-walk") {
    state.walksDone = (state.walksDone || 0) + 1;
    state.running = false; stopTicker(); state.exploTrack = null;
    const m = state.elapsed ? Math.max(1, Math.round(state.elapsed / 60)) : 0;
    if (m > 0 && state.consent) { state.week[6].min += m; save(); }
    reset(); state.screen = "home"; render();
    toast(m > 0 && state.consent ? "Marche enregistrée" : "Marche terminée");
    return;
  }
  if (a === "signup-open") { openSheet("signup"); return; }
  if (a === "login") { openSheet("login"); return; }
  if (a === "phone-edit") { openSheet("phone"); return; }
  if (a === "goal-edit") { openSheet("goal"); return; }
  if (a === "delete-open") { state.deleteStep = "start"; openSheet("delete"); return; }
  if (a === "pedo-open") { state.pedoScan = "idle"; openSheet("pedo"); return; }
  if (a === "pas-day") { state.pasDay = Math.max(0, Math.min(365, parseInt(b.dataset.d, 10))); render(false); return; }
  if (a === "pas-week") { state.pasWeek = Math.max(0, Math.min(52, parseInt(b.dataset.w, 10))); render(false); return; }
  if (a === "go-pas7") { state.pasMetric = "pas"; state.pasPeriod = "7j"; state.pasWeek = 0; go("activite"); return; }
  if (a === "help-open") { state.helpKind = b.dataset.h || "pas"; openSheet("help"); return; }
  if (a === "pas-block") { state.pasBlock = Math.max(0, Math.min(20, parseInt(b.dataset.d, 10))); render(false); return; }
  if (a === "card-open") { const it = PARC_ROWS[b.dataset.row][parseInt(b.dataset.i, 10)]; state.infoTitle = it.t; state.infoBody = it.body; openSheet("info"); return; }
  if (a === "bal-open") { state.balOpen = { type: b.dataset.type, id: b.dataset.id }; state.balDTab = "carte"; state.screen = "balade"; render(); return; }
  if (a === "bal-share-page") { state.balShare = b.dataset.id; openSheet("share"); return; }
  if (a === "print-fiche") { try { window.print(); } catch (e) { toast("Impression indisponible ici"); } return; }
  if (a === "bal-dtab") { state.balDTab = b.dataset.t; render(false); return; }
  if (a === "ideas-open") { state.chTab = "pas"; go("pas-a-pas"); return; }
  if (a === "open-metric") { state.pasMetric = b.dataset.m; state.screen = "activite"; render(); return; }
  if (a === "trophy-open") { state.trophyIdx = parseInt(b.dataset.i, 10) || 0; openSheet("trophy"); return; }
  if (a === "ch-cat") { state.chCat = b.dataset.t; render(false); return; }
  if (a === "defi-validate") { const v = { ...(state.defisValides || {}) }; v[b.dataset.id] = !v[b.dataset.id]; state.defisValides = v; save(); render(false); return; }
  if (a === "bal-tab") { state.balTab = b.dataset.t; render(false); return; }
  if (a === "bal-filter-open") { openSheet("filter"); return; }
  if (a === "bal-reset-type") { state.balMode = "all"; render(false); return; }
  if (a === "bal-reset-diff") { state.balDiff = "all"; render(false); return; }
  if (a === "bal-pick") { const v = b.dataset.v || ""; state.balSearch = { scope: v ? "city" : "near", city: v }; if (!v) state.locAuth = true; state.balLocMsg = null; render(false); return; }
  if (a === "bal-loc-off") { state.locAuth = false; render(false); return; }
  if (a === "bal-clear-text") { const i = document.querySelector("input[name=bal-q]"); if (i) { i.value = ""; i.focus(); } b.hidden = true; const box = document.getElementById("bal-suggest"); if (box) box.innerHTML = balSuggestHTML(""); return; }
  if (a === "bal-clear") { state.balSearch = { scope: "near", city: "" }; state.balLocMsg = null; render(false); return; }
  if (a === "bal-mode") { state.balMode = b.dataset.m; render(false); return; }
  if (a === "bal-follow") {
    const id = b.dataset.id, i = state.balFollowed.indexOf(id);
    if (i >= 0) state.balFollowed.splice(i, 1); else state.balFollowed.push(id);
    render(false); toast(i >= 0 ? "Parcours retiré de vos balades" : "Parcours suivi");
    return;
  }
  if (a === "bal-share") { state.balShare = b.dataset.id; openSheet("share"); return; }
  if (a === "obs-vote") { state.votes[b.dataset.id] = b.dataset.v; render(false); return; }
  if (a === "explo-start") {
    const r = document.querySelector("input[name=explo-track]:checked");
    state.exploTrack = r ? r.value : BAL_PARCOURS[0].id;
    state.elapsed = 0; state.goalAnnounced = false; state.feeling = null; state.note = ""; state.lastMinutes = 0;
    state.running = true; state.screen = "walk"; render(); startTicker();
    return;
  }
  if (a === "camp-join") {
    const c = BAL_CAMPAGNES.find(x => x.id === b.dataset.id);
    if (!c || c.count >= c.max || state.campJoined.includes(c.id)) return;
    c.count += 1; state.campJoined.push(c.id); render(false);
    toast("Demande envoyée à l'animateur");
    return;
  }
  if (a === "bal-join") {
    const c = BAL_CRENEAUX.find(x => x.id === b.dataset.id);
    if (!c || c.count >= c.max || state.balJoined.includes(c.id)) return;
    c.count += 1; state.balJoined.push(c.id); render(false); toast("Inscription confirmée");
    return;
  }
  if (a === "bal-leave") {
    const c = BAL_CRENEAUX.find(x => x.id === b.dataset.id);
    if (!c) return;
    c.count = Math.max(0, c.count - 1); state.balJoined = state.balJoined.filter(id => id !== c.id);
    render(false); toast("Inscription annulée");
    return;
  }
  if (a === "obs-open") { state.obsPhoto = false; openSheet("obs"); return; }
  if (a === "dc-new") { state.dcCreate = { title: "", theme: null, text: "", error: false }; render(false); return; }
  if (a === "dc-cancel") { state.dcCreate = null; render(false); return; }
  if (a === "dc-submit") {
    const c = state.dcCreate, title = c.title.trim(), text = c.text.trim();
    if (!title || !c.theme || !text) { c.error = true; render(false); return; }
    state.dcMine.unshift({ id: "d" + Date.now(), title, theme: c.theme, text, status: "En relecture" });
    state.dcCreate = null; render(false); toast("D-carte envoyée pour relecture");
    return;
  }
  if (a === "ch-tab") { state.chTab = b.dataset.t; render(false); return; }
  if (a === "ch-new") { state.chCreate = chNewState(); render(false); return; }
  if (a === "ch-cancel") { state.chCreate = null; render(false); return; }
  if (a === "ch-back") {
    const c = state.chCreate, order = chOrder(), idx = order.indexOf(c.step);
    c.error = false;
    if (idx <= 0) state.chCreate = null;
    else c.step = order[idx - 1];
    render(false); return;
  }
  if (a === "ch-next") {
    const c = state.chCreate, order = chOrder();
    const ok = c.step === "format" ? !!c.format : c.step === "access" ? !!c.access : c.step === "team" ? !!c.team : c.step === "goal" ? !!c.goal : true;
    if (!ok) { c.error = true; render(false); return; }
    c.error = false;
    c.step = order[order.indexOf(c.step) + 1];
    render(false); return;
  }
  if (a === "ch-create") {
    const c = state.chCreate, name = c.name.trim();
    if (!name) { c.error = true; render(false); return; }
    CH_DATA.mine.unshift({ id: "m" + Date.now(), name, format: c.format, access: c.access === "public" ? "Public" : "Privé", target: `${nf(c.goal)} pas par jour`, progress: 0, period: "En cours" });
    state.chCreate = null; state.chTab = "mine"; render(false); toast("Challenge créé");
    return;
  }
  if (a === "ch-accept") {
    const i = CH_DATA.discover.findIndex(c => c.id === b.dataset.id);
    if (i < 0) return;
    const c = CH_DATA.discover.splice(i, 1)[0];
    CH_DATA.mine.unshift({ id: c.id, name: c.name, format: c.format, access: c.access, target: c.target, progress: 0, period: "En cours" });
    render(false); toast("Défi accepté");
    return;
  }
  if (a === "pas-period") { state.pasPeriod = b.dataset.p; state.pasBlock = 0; render(false); return; }
  if (a === "profile") { go("profile"); return; }
  if (a === "logout") { state.onboarded = false; state.phone = ""; save(); go("onboarding"); return; }
  if (a === "sync") {
    if (!state.pedo) { toast("Aucun podomètre connecté"); return; }
    if (state.syncing) return;
    state.syncing = true; render(false);
    setTimeout(() => {
      state.syncing = false; state.syncDone = true;
      state.week[6].min += 12;
      state.lastSync = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      const firstSync = !state.syncCount;
      state.syncCount = (state.syncCount || 0) + 1;
      save(); render(false);
      toast("1 200 pas ajoutés (démo)");
      if (firstSync) { state.reward = { name: "Premier pas", icon: "footprint", reason: "Vos pas sont arrivés dans l'application pour la première fois. Chaque pas compte, et vous venez de commencer." }; openSheet("reward"); }
      setTimeout(() => { state.syncDone = false; render(false); }, 1500);
    }, 2000);
    return;
  }
  if (a === "pedo") { toast(state.pedo ? "Podomètre connecté : " + state.pedo : "Aucun podomètre connecté"); return; }
  if (a === "pedo-scan") {
    state.scanning = true; state.scanFound = false; state.devPick = null; render(false);
    setTimeout(() => {
      if (state.screen === "onboarding" && state.obStep === 3 && state.scanning) {
        state.scanning = false; state.scanFound = true; render(false);
        document.querySelector("input[name=device]")?.focus();
      }
    }, 1400);
    return;
  }
  if (a === "pedo-connect") {
    const c = document.querySelector("input[name=device]:checked");
    if (!c) { toast("Choisissez un appareil dans la liste"); return; }
    state.pedo = DEVICES[parseInt(c.value, 10)]; state.scanFound = false; state.onbSync = "syncing"; save(); render(false);
    setTimeout(() => { if (state.onbSync === "syncing") { state.onbSync = "done"; render(false); } }, 2000);
    return;
  }
  if (a === "pedo-off") { state.pedo = null; state.lastSync = null; save(); render(false); toast("Podomètre déconnecté"); return; }
  if (a === "toggle") {

    state[k] = on; b.setAttribute("aria-checked", String(on));

    applyPrefs(); save();
    if (k === "consent") toast(on ? "Vos marches seront enregistrées" : "Vos marches ne seront plus enregistrées");
    if (k === "notif1" || k === "notif2") toast(on ? "Notifications activées (démo)" : "Notifications désactivées");
    return;
  }
  if (a === "clear-ask") { state.confirmClear = true; render(false); document.querySelector("[data-action=clear-confirm]").focus(); return; }
  if (a === "clear-cancel") { state.confirmClear = false; render(false); document.querySelector("[data-action=clear-ask]").focus(); return; }
  if (a === "clear-confirm") { state.week.forEach(d => { d.min = 0; d.feel = null; }); state.confirmClear = false; save(); render(false); document.querySelector("[data-action=clear-ask]").focus(); toast("Données effacées"); return; }
  if (a === "restart") { state.onboarded = false; save(); state.obStep = 0; state.screen = "onboarding"; render(); return; }
});
function reset(){ state.elapsed = 0; state.feeling = null; state.note = ""; state.lastMinutes = 0; state.goalAnnounced = false; }

document.getElementById("app").addEventListener("change", e => {
  const t = e.target; const n = t.name;
  if (n === "level") { state.level = t.value; state.obError = false; const er = document.querySelector(".error"); if (er) er.hidden = true; }
  if (n === "consent") { state.consent = t.value === "yes"; state.obError = false; const er = document.querySelector(".error"); if (er) er.hidden = true; }
  if (n === "consent-check") { state.consent = t.checked; save(); }
  if (n === "explo-track") { state.exploPick = t.value; return; }
  if (n === "device") { state.devPick = t.value; const b = document.querySelector('[data-action="pedo-connect"]'); if (b) b.disabled = false; return; }
  if (n === "goal-metric") { state.goalMetric = t.value; save(); render(false); return; }
  if (state.chCreate && n === "ch-format") { state.chCreate.format = t.value; state.chCreate.error = false; render(false); return; }
  if (state.chCreate && n === "ch-access") { state.chCreate.access = t.value; state.chCreate.error = false; render(false); return; }
  if (state.chCreate && n === "ch-share") { state.chCreate.share = t.value; render(false); return; }
  if (state.dcCreate && n === "dc-theme") { state.dcCreate.theme = t.value; state.dcCreate.error = false; render(false); return; }
  if (state.chCreate && n === "ch-goal") { state.chCreate.goal = parseInt(t.value, 10); state.chCreate.error = false; render(false); return; }
  if (state.chCreate && n === "ch-team") { state.chCreate.team = t.value; state.chCreate.error = false; render(false); return; }
  if (n === "duration") state.duration = parseInt(t.value, 10);
  if (n === "demo") state.demo = t.checked;
  if (n === "feel") { state.feeling = t.value; document.getElementById("gene-msg").hidden = t.value !== "gene"; }
  if (n === "textsize") { state.textSize = t.value; applyPrefs(); save(); }
  if (n === "level-s") { state.level = t.value; save(); toast("Votre façon de marcher est mise à jour"); }
});
document.getElementById("app").addEventListener("input", e => { if (e.target.name === "note") state.note = e.target.value; if (e.target.name === "ch-name" && state.chCreate) state.chCreate.name = e.target.value; if (state.dcCreate && e.target.name === "dc-title") state.dcCreate.title = e.target.value; if (state.dcCreate && e.target.name === "dc-text") state.dcCreate.text = e.target.value; });

/* Panneau prototype */
const list = document.getElementById("proto-list");
list.innerHTML = SCREENS.map(([k,l]) => `<li><button type="button" data-to="${k}">${l}</button></li>`).join("");
list.addEventListener("click", e => {
  const b = e.target.closest("button[data-to]"); if (!b) return;
  if (b.dataset.to !== "onboarding" && !state.level) state.level = "doux";
  if (b.dataset.to !== "onboarding") state.consent = true;
  go(b.dataset.to);
});
if (window.matchMedia("(max-width: 899px)").matches) document.getElementById("proto").open = false;

load(); applyPrefs();
state.screen = state.onboarded ? "home" : "onboarding";
render(false);
})();
</script>
